ja:
  address_format_i18n:
    delimiter: ' '
    field_suffixes:
      fn: '様'      # 名前に「様」
      #org: '御中'   # 会社名に「御中」
    fields:
      - company
      - company_kana
      - lastname
      - firstname
      - lastname_kana
      - firstname_kana
      - country
      - zipcode
      - state
      - city
      - address1
      - address2
      - phone
      - fax
    groups:
      - name: org
        fields: [company]
      - name: fn
        fields: [lastname, firstname, lastname_kana, firstname_kana]
      - name: adr
        fields: []
        children:
          - name: country-name
            fields: [country]
          - name: local
            fields: [zipcode, state, city]
          - name: street-address
            fields: [address1, address2]
          - name: phone
            fields: [phone]

    account:
      profile:
        - last_name
        - first_name
        - phone
        - email
    address:
      full_name:
        - last_name
        - first_name
